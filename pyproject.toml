[project]
name = "ethiopia-mpi"
version = "0.1.0"
description = "Multidimensional poverty (OPHI MPI) in Ethiopia from DHS 2019, with survey design and an ML feature-importance overlay."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Muhanad", email = "muhanad.a.husn@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyreadstat>=1.2",       # reads DHS .DTA / .SAV recode files
    "requests>=2.32",
    "requests-cache>=1.2",   # caches the GADM boundary download
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "geopandas>=1.0",        # regional MPI choropleth
    "shapely>=2.0",
    "pyogrio>=0.7",
    "mapclassify>=2.6",
]
survey = [
    "svy>=0.18",             # survey-weighted estimation (clusters + strata + weights)
]
ml = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pre-commit>=3.6",
    "jupytext>=1.16",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethiopia_mpi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
